name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  package:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build six platform archives
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python3 scripts/release.py --version "$RELEASE_VERSION"
      - name: Create a draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" dist/"$RELEASE_VERSION"/* \
            --verify-tag --draft --title "$RELEASE_VERSION" --generate-notes
